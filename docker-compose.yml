services:
  postgres:
    image: postgres:17-alpine
    container_name: todo-students-postgres
    environment:
      POSTGRES_DB: todo_students
      POSTGRES_USER: todo_app
      POSTGRES_PASSWORD: change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_app -d todo_students"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
